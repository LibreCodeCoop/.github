name: Build and publish app release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish.
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Build and publish release
        uses: LibreCodeCoop/.github/actions/nextcloud-appstore-publish@8873f2e2ac1b9de5396de3d677f57e58c98d772e
        with:
          release-tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          appstore-token: ${{ secrets.APPSTORE_TOKEN }}
          manual-recovery: ${{ github.event_name == 'workflow_dispatch' }}
