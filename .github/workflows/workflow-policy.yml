name: Workflow policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'workflow-templates/**'
      - 'scripts/check_workflow_policy.py'
      - 'tests/test_workflow_policy.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'workflow-templates/**'
      - 'scripts/check_workflow_policy.py'
      - 'tests/test_workflow_policy.py'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow policy
        run: python3 scripts/check_workflow_policy.py
