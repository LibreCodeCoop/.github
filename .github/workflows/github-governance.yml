name: GitHub governance

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply governance changes
        required: false
        default: false
        type: boolean
      repository:
        description: Optional repository name (no owner); empty selects all public repositories
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - governance.config.json
      - .github/workflows/github-governance.yml
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: github-governance-${{ inputs.apply && 'apply' || 'plan' }}
  cancel-in-progress: ${{ !inputs.apply }}

jobs:
  plan:
    name: Plan LibreCodeCoop governance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout caller configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plan repository governance (read only)
        uses: LibreCodeCoop/github-governance@0cbd31b136c0a1dd7dcaf805924aacd3e9f0ba71 # public planning support; pin immutable commit
        with:
          token: ${{ github.token }}
          organization: ${{ inputs.repository == '' && 'LibreCodeCoop' || '' }}
          repository: ${{ inputs.repository != '' && format('LibreCodeCoop/{0}', inputs.repository) || '' }}
          config: ${{ github.workspace }}/governance.config.json
          public-discovery: ${{ inputs.repository == '' && 'true' || 'false' }}
          allow-drift: 'true'
          apply: 'false'

  apply:
    name: Apply LibreCodeCoop governance
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only the privileged Apply job has access to the protected GitHub App key.
    environment: ruleset-sync
    steps:
      - name: Checkout caller configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate GitHub App for Apply
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RULESET_APP_CLIENT_ID }}
          private-key: ${{ secrets.RULESET_APP_PRIVATE_KEY }}
          owner: LibreCodeCoop # zizmor: ignore[github-app] governance is explicitly organization-scoped
          repositories: ${{ inputs.repository }}
          permission-administration: write

      - name: Apply repository governance
        uses: LibreCodeCoop/github-governance@0cbd31b136c0a1dd7dcaf805924aacd3e9f0ba71 # public planning support; pin immutable commit
        with:
          token: ${{ steps.app-token.outputs.token }}
          organization: ${{ inputs.repository == '' && 'LibreCodeCoop' || '' }}
          repository: ${{ inputs.repository != '' && format('LibreCodeCoop/{0}', inputs.repository) || '' }}
          config: ${{ github.workspace }}/governance.config.json
          apply: 'true'
