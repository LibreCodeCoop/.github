name: GitHub governance

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply governance changes
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - governance.config.json
      - .github/workflows/github-governance.yml
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: github-governance
  cancel-in-progress: false

jobs:
  discover:
    name: Discover public repositories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repositories: ${{ steps.repositories.outputs.repositories }}

    steps:
      - name: List repositories
        id: repositories
        env:
          ORGANIZATION: LibreCodeCoop
        run: |
          repositories='[]'
          page=1

          while true; do
            response="$(
              curl --fail --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                "https://api.github.com/orgs/$ORGANIZATION/repos?type=public&per_page=100&page=$page"
            )"

            count="$(jq 'length' <<< "$response")"
            if [[ "$count" -eq 0 ]]; then
              break
            fi

            repositories="$(
              jq -cn \
                --argjson existing "$repositories" \
                --argjson page "$response" \
                '$existing + [$page[] | select(.archived == false) | .name] | unique'
            )"

            if [[ "$count" -lt 100 ]]; then
              break
            fi

            page=$((page + 1))
          done

          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"

  reconcile:
    name: ${{ inputs.apply && 'Apply' || 'Plan' }} LibreCodeCoop/${{ matrix.repository }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ruleset-sync

    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.discover.outputs.repositories) }}

    steps:
      - name: Checkout caller configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RULESET_APP_CLIENT_ID }}
          private-key: ${{ secrets.RULESET_APP_PRIVATE_KEY }}
          owner: LibreCodeCoop
          repositories: ${{ matrix.repository }}
          permission-administration: ${{ inputs.apply && 'write' || 'read' }}

      - name: Reconcile repository governance
        uses: LibreCodeCoop/github-governance@0649e8297c2750778d60defb19ab822619c7e0dc
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: LibreCodeCoop/${{ matrix.repository }}
          config: ${{ github.workspace }}/governance.config.json
          apply: ${{ inputs.apply && 'true' || 'false' }}
