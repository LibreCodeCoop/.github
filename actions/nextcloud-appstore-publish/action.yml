name: Build and publish Nextcloud app release
description: Build, package, sign, attach and publish a tagged Nextcloud app release.

inputs:
  release-tag:
    description: Existing Git tag to build and publish.
    required: true
  github-token:
    description: Token used to validate and update the GitHub release.
    required: true
  app-private-key:
    description: Nextcloud app private key.
    required: true
  appstore-token:
    description: Nextcloud App Store token.
    required: true
  checkout-submodules:
    description: Checkout application git submodules.
    required: false
    default: 'false'
  make-signs-app:
    description: Let the Makefile sign the app instead of the generic post-package signing step.
    required: false
    default: 'false'
  require-setup-signatures:
    description: Require setup integrity metadata in Makefile-built packages.
    required: false
    default: 'false'
  manual-recovery:
    description: Use packaging tooling from the workflow ref while keeping tagged application source immutable.
    required: false
    default: 'false'
  release-tool-revision:
    description: Immutable release-tool revision.
    required: false
    default: '385ca7732db12e5c79590bb21be8da3608194595'

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        CHECKOUT_SUBMODULES: ${{ inputs.checkout-submodules }}
        MAKE_SIGNS_APP: ${{ inputs.make-signs-app }}
        REQUIRE_SETUP_SIGNATURES: ${{ inputs.require-setup-signatures }}
        MANUAL_RECOVERY: ${{ inputs.manual-recovery }}
      run: |
        set -euo pipefail
        for value in "${CHECKOUT_SUBMODULES}" "${MAKE_SIGNS_APP}" "${REQUIRE_SETUP_SIGNATURES}" "${MANUAL_RECOVERY}"; do
          case "${value}" in
            true|false) ;;
            *)
              echo "::error::Boolean inputs must be 'true' or 'false'"
              exit 2
              ;;
          esac
        done

    - name: Set application environment
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        set -euo pipefail
        echo "APP_NAME=${GITHUB_REPOSITORY##*/}" >> "${GITHUB_ENV}"
        echo "APP_VERSION=${RELEASE_TAG}" >> "${GITHUB_ENV}"

    - name: Checkout application
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: ${{ inputs.checkout-submodules }}
        fetch-tags: true
        fetch-depth: 0
        ref: ${{ inputs.release-tag }}
        path: ${{ env.APP_NAME }}

    - name: Validate release identity
      id: release-identity
      uses: LibreCodeCoop/release-tool/actions/release-identity@${{ inputs.release-tool-revision }}
      with:
        tag: ${{ inputs.release-tag }}
        working-directory: ${{ env.APP_NAME }}
        require-tag-exists: 'true'

    - name: Get appinfo data
      id: appinfo
      uses: skjnldsv/xpath-action@f5b036e9d973f42c86324833fd00be90665fbf77 # v1.0.0
      with:
        filename: ${{ env.APP_NAME }}/appinfo/info.xml
        expression: "//info//dependencies//nextcloud/@min-version"

    - name: Read package engines
      id: versions
      continue-on-error: true
      uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
      with:
        path: ${{ env.APP_NAME }}
        fallbackNode: '^24'
        fallbackNpm: '^11.3'

    - name: Set up node
      if: ${{ steps.versions.outputs.nodeVersion }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.versions.outputs.nodeVersion }}
        package-manager-cache: false

    - name: Set up npm
      if: ${{ steps.versions.outputs.npmVersion }}
      shell: bash
      env:
        NPM_VERSION: ${{ steps.versions.outputs.npmVersion }}
      run: npm i -g "npm@${NPM_VERSION}"

    - name: Resolve PHP version
      id: php-versions
      uses: nextcloud-libraries/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3
      with:
        filename: ${{ env.APP_NAME }}/appinfo/info.xml

    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ steps.php-versions.outputs.php-min }}
        coverage: none
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Check composer.json
      id: check-composer
      uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
      with:
        files: "${{ env.APP_NAME }}/composer.json"

    - name: Install composer dependencies
      if: steps.check-composer.outputs.files_exists == 'true'
      uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      with:
        composer-options: '--no-dev'
        working-directory: ${{ env.APP_NAME }}
        ignore-cache: 'yes'

    - name: Build application
      if: ${{ steps.versions.outputs.nodeVersion }}
      shell: bash
      env:
        CYPRESS_INSTALL_BINARY: 0
      run: |
        set -euo pipefail
        cd "${APP_NAME}"
        npm ci
        npm run build --if-present

    - name: Check Krankerl config
      id: krankerl
      uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
      with:
        files: ${{ env.APP_NAME }}/krankerl.toml

    - name: Install Krankerl
      if: steps.krankerl.outputs.files_exists == 'true'
      shell: bash
      run: |
        set -euo pipefail
        wget --quiet https://github.com/ChristophWurst/krankerl/releases/download/v0.14.0/krankerl_0.14.0_amd64.deb
        sudo dpkg -i krankerl_0.14.0_amd64.deb

    - name: Package with Krankerl
      if: steps.krankerl.outputs.files_exists == 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd "${APP_NAME}"
        krankerl package

    - name: Resolve Nextcloud server download
      if: steps.krankerl.outputs.files_exists != 'true'
      shell: bash
      env:
        NC_VERSION: ${{ fromJSON(steps.appinfo.outputs.result).nextcloud.min-version }}
      run: |
        set -euo pipefail
        download_url="$(curl --fail --silent --show-error "https://updates.nextcloud.com/updater_server/latest?channel=beta&version=${NC_VERSION}" | jq -r '.downloads.zip[0]')"
        echo "DOWNLOAD_URL=${download_url}" >> "${GITHUB_ENV}"

    - name: Download Nextcloud server
      id: server-download
      if: steps.krankerl.outputs.files_exists != 'true' && env.DOWNLOAD_URL != 'null'
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        wget "${DOWNLOAD_URL}" -O nextcloud.zip
        unzip -q nextcloud.zip

    - name: Checkout Nextcloud server fallback
      if: steps.krankerl.outputs.files_exists != 'true' && steps.server-download.outcome != 'success'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: true
        repository: nextcloud/server
        path: nextcloud

    - name: Validate manual recovery source
      if: inputs.manual-recovery == 'true' && steps.krankerl.outputs.files_exists != 'true'
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        set -euo pipefail

        case "${GITHUB_REF_NAME}" in
          stable*) ;;
          *)
            echo "::error::Manual release recovery must be dispatched from a stable branch"
            exit 1
            ;;
        esac

        cd "${APP_NAME}"
        git fetch --quiet origin "${GITHUB_SHA}"
        tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
        if ! git merge-base --is-ancestor "${tag_sha}" "${GITHUB_SHA}"; then
          echo "::error::${GITHUB_REF_NAME} does not contain ${RELEASE_TAG}; refusing cross-line recovery"
          exit 1
        fi
        git show "${GITHUB_SHA}:Makefile" > Makefile

    - name: Package with Makefile
      if: steps.krankerl.outputs.files_exists != 'true'
      shell: bash
      env:
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        REQUIRE_SETUP_SIGNATURES: ${{ inputs.require-setup-signatures }}
        MAKE_SIGNS_APP: ${{ inputs.make-signs-app }}
      run: |
        set -euo pipefail
        cd "${APP_NAME}"
        if [[ "${MAKE_SIGNS_APP}" == "true" ]]; then
          mkdir -p build/tools/certificates
          printf '%s' "${APP_PRIVATE_KEY}" > "build/tools/certificates/${APP_NAME}.key"
        fi
        make appstore
        if make -qp 2>/dev/null | grep -q '^verify-appstore-package:'; then
          REQUIRE_SETUP_SIGNATURES="${REQUIRE_SETUP_SIGNATURES}" make verify-appstore-package
        fi

    - name: Sign generic Makefile package
      if: steps.krankerl.outputs.files_exists != 'true' && inputs.make-signs-app != 'true'
      shell: bash
      env:
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
      run: |
        set -euo pipefail
        cd "${APP_NAME}/build/artifacts"
        tar -xvf "${APP_NAME}.tar.gz"
        cd ../../..
        printf '%s' "${APP_PRIVATE_KEY}" > "${APP_NAME}.key"
        wget --quiet "https://github.com/nextcloud/app-certificate-requests/raw/master/${APP_NAME}/${APP_NAME}.crt"
        php nextcloud/occ integrity:sign-app           --privateKey="../${APP_NAME}.key"           --certificate="../${APP_NAME}.crt"           --path="../${APP_NAME}/build/artifacts/${APP_NAME}"
        cd "${APP_NAME}/build/artifacts"
        tar -zcvf "${APP_NAME}.tar.gz" "${APP_NAME}"

    - name: Set up PHP 8.3 for release-tool
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: '8.3'
        coverage: none
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Validate release artifact
      uses: LibreCodeCoop/release-tool/actions/artifact-validate@${{ inputs.release-tool-revision }}
      with:
        artifact: ${{ env.APP_NAME }}/build/artifacts/${{ env.APP_NAME }}.tar.gz
        app-name: ${{ env.APP_NAME }}
        version: ${{ steps.release-identity.outputs.version }}

    - name: Attach tarball to GitHub release
      id: attach-to-release
      uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
      with:
        repo_token: ${{ inputs.github-token }}
        file: ${{ env.APP_NAME }}/build/artifacts/${{ env.APP_NAME }}.tar.gz
        asset_name: ${{ env.APP_NAME }}-${{ inputs.release-tag }}.tar.gz
        tag: ${{ inputs.release-tag }}
        overwrite: true

    - name: Upload app to Nextcloud App Store
      uses: nextcloud-libraries/nextcloud-appstore-push-action@a011fe619bcf6e77ddebc96f9908e1af4071b9c1 # v1.0.3
      with:
        app_name: ${{ env.APP_NAME }}
        appstore_token: ${{ inputs.appstore-token }}
        download_url: ${{ steps.attach-to-release.outputs.browser_download_url }}
        app_private_key: ${{ inputs.app-private-key }}

    - name: Verify App Store publication
      uses: LibreCodeCoop/release-tool/actions/appstore-publication-wait@${{ inputs.release-tool-revision }}
      with:
        app-name: ${{ env.APP_NAME }}
        version: ${{ steps.release-identity.outputs.version }}
        platform: ${{ fromJSON(steps.appinfo.outputs.result).nextcloud.min-version }}
